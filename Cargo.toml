[workspace]

[package]
name = "symbolaio"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "symbolaio-cli"

[workspace.dependencies]
loco-rs = { version = "0.15" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", ] }
async-trait = { version = "0.1.74" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", ] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.16", features = ["v4"] }
axum-extra = { version = "0.10", features = ["form"] }
axum-login = "0.17"
password-auth = "1.0"
tower-sessions = { version = "0.14", default-features = false, features = [
    "signed",
] }
gix = "0.71"
tempfile = "3"
seaography = { version = "1.1", features = ["with-decimal", "with-chrono"] }
async-graphql-axum = { version = "7.0" }
lazy_static = { version = "1.5" }
tower-service = { version = "0.3" }

dotenvy = "0.15"
crudcrate = "0.3"
utoipa = "5.3"
tower-sessions-sqlx-store = { version = "0.14", features = ["postgres"] }
reqwest = "0.12"
serde_yaml = "0.9.34+deprecated"
thiserror = "1.0"
zip = "2.6.1"

[[bin]]
name = "symbolaio-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.21.0" }
insta = { version = "1.34.0", features = ["redactions", "yaml", "filters"] }
