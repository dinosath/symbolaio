[workspace]
resolver = "2"
members = [
    "core/proto",
    "core/events",
    "core/page-engine",
    "core/object-engine",
    "backend/gateway",
    "operator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# GraphQL
async-graphql = { version = "7", features = ["uuid", "chrono"] }
async-graphql-axum = "7"

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# NATS
async-nats = "0.37"

# Kubernetes
kube = { version = "0.93", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.22", features = ["latest"] }
schemars = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# OpenAPI parsing
openapiv3 = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
futures = "0.3"

# Internal crates
symbolaio-proto = { path = "core/proto" }
symbolaio-events = { path = "core/events" }
symbolaio-page-engine = { path = "core/page-engine" }
symbolaio-object-engine = { path = "core/object-engine" }
